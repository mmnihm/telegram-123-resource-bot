services:
  - type: web
    name: telegram-pickup-code-bot
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: STORAGE_CHANNEL_ID
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: DATABASE_FILE
        value: /data/store.db
