name: Check bot
on:
  push:
    branches: ["rewrite/telegram-channel-pickup-bot"]
  pull_request:
    branches: ["main"]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --check index.js
